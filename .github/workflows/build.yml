name: Build APK + Website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare files
        run: |
          mkdir -p www assets
          cp index.html config.js logic.js gfx.js app.js manifest.webmanifest icon-192.png icon-512.png www/
          cp icon.png assets/icon.png
          cp icon.png assets/icon-only.png
          cp splash.png assets/splash.png
          cp splash.png assets/splash-dark.png
      - name: Install
        run: npm install
      - name: Add Android
        run: npx cap add android
      - name: Mic permission
        run: |
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n</manifest>#' android/app/src/main/AndroidManifest.xml
          grep -q RECORD_AUDIO android/app/src/main/AndroidManifest.xml
      - name: Icons
        run: npx capacitor-assets generate --android --iconBackgroundColor '#151d36' --splashBackgroundColor '#151d36' || true
      - name: Sync
        run: npx cap sync android
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Rename
        run: cp android/app/build/outputs/apk/debug/app-debug.apk arwah.apk
      - uses: actions/upload-artifact@v4
        with:
          name: arwah-apk
          path: arwah.apk
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: الأربع أرواح — آخر نسخة
          body: نزّل arwah.apk على الموبايل وسطّبه.
          files: arwah.apk
          make_latest: true

  site:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare site
        run: |
          mkdir -p www
          cp index.html config.js logic.js gfx.js app.js manifest.webmanifest icon-192.png icon-512.png www/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - id: deploy
        uses: actions/deploy-pages@v4
